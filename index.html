<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieBoxTV - Free Movies & Anime Online</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #060709;
            color: #fff;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Left Navigation Bar (MovieBox Sidebar) */
        .sidebar {
            width: 80px;
            background-color: #0b0c10;
            border-right: 1px solid #141722;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
            gap: 25px;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 10;
        }

        .sidebar-logo {
            font-size: 28px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }

        .sidebar-icon {
            font-size: 22px;
            color: #555c6d;
            cursor: pointer;
            transition: 0.2s;
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }

        .sidebar-icon:hover, .sidebar-icon.active {
            color: #39e75f;
            background-color: #121e16;
        }

        /* Main Content Container */
        .main-content {
            margin-left: 80px;
            flex: 1;
            padding: 25px 40px;
            background: linear-gradient(to bottom, #090e0c, #060709);
        }

        /* Top Header Area */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
        }

        .brand-info {
            text-align: left;
        }
        .brand-info h4 { font-size: 13px; color: #888; font-weight: 500; text-transform: uppercase; letter-spacing: 1px; }
        .brand-info h2 { font-size: 18px; color: #fff; font-weight: 700; margin-top: 2px; }

        .top-right-nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        /* Shining Green GET APP Button inspired by modern web apps */
        .get-app-btn {
            background-color: #39e75f;
            color: #000;
            border: none;
            padding: 10px 22px;
            border-radius: 25px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            box-shadow: 0 0 15px rgba(57, 231, 95, 0.4);
        }
        .get-app-btn:hover {
            background-color: #2bc44e;
            transform: scale(1.03);
        }

        .search-box input {
            width: 260px;
            padding: 10px 18px;
            background-color: #0b0c10;
            border: 1px solid #1e2230;
            border-radius: 25px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .search-box input:focus { border-color: #39e75f; }

        /* Premium Featured Banner */
        .featured-banner {
            background: linear-gradient(to right, rgba(6,7,9,1) 30%, rgba(6,7,9,0.3) 100%), url('https://unsplash.com') no-repeat center center;
            background-size: cover;
            border-radius: 16px;
            padding: 50px;
            text-align: left;
            margin-bottom: 35px;
            border: 1px solid #141722;
        }

        .banner-title {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 25px;
            max-width: 600px;
            line-height: 1.1;
        }

        .banner-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-watch {
            background: linear-gradient(135deg, #ffc107, #ff9800);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px 28px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }
        .btn-watch:hover { transform: scale(1.02); }

        /* Content Rows Sections */
        .section-heading {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #39e75f;
        }

        .grid-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 45px;
        }

        .media-card {
            background-color: #0b0c10;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #141722;
            cursor: pointer;
            transition: 0.25s ease;
            text-align: left;
            position: relative;
        }

        .media-card:hover {
            transform: translateY(-5px);
            border-color: #39e75f;
            box-shadow: 0 5px 20px rgba(57, 231, 95, 0.1);
        }

        .card-thumb {
            width: 100%;
            height: 150px;
            background-color: #12141c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 46px;
        }

        .card-details {
            padding: 15px;
        }

        .card-title {
            font-size: 14px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .card-subtitle {
            font-size: 12px;
            color: #555c6d;
            font-weight: 600;
        }

        .rating-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(0,0,0,0.8);
            color: #ffc107;
            padding: 3px 7px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* VLC Overlay Pop-up Video Window Player Framework */
        .vlc-overlay-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            z-index: 100;
            display: none; 
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .vlc-window-box {
            background-color: #0b0c10;
            border: 3px solid #ffaa00; /* VLC cone theme orange border */
            width: 100%;
            max-width: 900px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        video { width: 100%; display: block; max-height: 500px; background: #000; }

        .vlc-control-panel {
            background-color: #1a1b23;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid #252733;
        }

        .vlc-meta h3 { color: #ffaa00; font-size: 16px; font-weight: 700; }
        .vlc-meta p { color: #777; font-size: 11px; margin-top: 2px; }

        .btn-close-vlc {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }

        #hidden-file-injector { display: none; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- Left Sidebar Menu -->
    <div class="sidebar">
        <div class="sidebar-logo">🎬</div>
        <div class="sidebar-icon active">🏠</div>
        <div class="sidebar-icon">📺</div>
        <div class="sidebar-icon">📦</div>
        <div class="sidebar-icon">😊</div>
        <div class="sidebar-icon">❤️</div>
        <div class="sidebar-icon">💾</div>
        <div class="sidebar-icon">⬇️</div>
    </div>

    <!-- Main Dashboard Section Box -->
    <div class="main-content">
        
        <!-- Header -->
        <header>

                <button class="get-app-btn" onclick="triggerDownloadAlert()">⚡ GET APP</button>

        <div class="section-heading">🏴‍☠️ Premium Anime Selection</div>
