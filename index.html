<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Stream - Practice App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #111;
            color: #fff;
        }

        /* Header & Blue Circle Logo */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 40px;
            background-color: #1a1a1a;
            border-bottom: 2px solid #222;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Aapka Manga Hua Blue Circle Logo */
        .blue-circle-logo {
            width: 40px;
            height: 40px;
            background-color: #007bff;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.5);
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Main Video Player Section */
        .main-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .player-wrapper {
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            margin-bottom: 30px;
        }

        video {
            width: 100%;
            display: block;
        }

        .video-info {
            padding: 20px;
            background: #1a1a1a;
        }

        .video-info h2 {
            margin-bottom: 10px;
            color: #007bff;
        }

        /* Category Filter Buttons */
        .categories {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .category-btn {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .category-btn:hover, .category-btn.active {
            background: #007bff;
            border-color: #007bff;
        }

        /* Movie/Video Grid */
        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .video-card {
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
            border: 1px solid #222;
        }

        .video-card:hover {
            transform: translateY(-5px);
            border-color: #007bff;
        }

        .thumbnail-placeholder {
            width: 100%;
            height: 150px;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #555;
        }

        .card-details {
            padding: 15px;
        }

        .card-details h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .card-details p {
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <!-- Header Section with Blue Circle Logo -->
    <header>
        <div class="logo-container">
            <div class="blue-circle-logo"></div>
            <div class="logo-text">Stream<span style="color:#007bff;">Hub</span></div>
        </div>
    </header>

    <div class="main-container">
        <!-- Video Player -->
        <div class="player-wrapper">
            <video id="main-player" controls autoplay poster="https://placeholder.com">
                <source id="video-source" src="" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            <div class="video-info">
                <h2 id="player-title">Welcome to StreamHub</h2>
                <p id="player-desc">Neeche di gayi list se koi bhi legal public-domain video select karke play karein.</p>
            </div>
        </div>

        <!-- Filters -->
        <div class="categories">
            <button class="category-btn active" onclick="filterVideos('all')">All</button>
            <button class="category-btn" onclick="filterVideos('animation')">Animation</button>
            <button class="category-btn" onclick="filterVideos('nature')">Nature</button>
        </div>

        <!-- Video Grid (Legal Open-Source Sample Videos) -->
        <div class="video-grid" id="grid-container">
            <!-- Videos JavaScript se dynamic load honge -->
        </div>
    </div>

    <script>
        // Legal & Free Public Domain Sample Videos
        const videoList = [
            {
                id: 1,
                title: "Big Buck Bunny",
                category: "animation",
                desc: "A large and lovable rabbit deals with bullying forest creatures in this famous open-source animated short.",
                url: "https://googleapis.com",
                emoji: "🐰"
            },
            {
                id: 2,
                title: "Sintel (Open Movie Project)",
                category: "animation",
                desc: "The emotional journey of a girl searching for her pet dragon, created by the Blender Foundation.",
                url: "https://googleapis.com",
                emoji: "🐉"
            },
            {
                id: 3,
                title: "Tears of Steel",
                category: "animation",
                desc: "A sci-fi short set in a dystopian future, showcasing open-source visual effects.",
                url: "https://googleapis.com",
                emoji: "🤖"
            },
            {
                id: 4,
                title: "For Bigger Blazes",
                category: "nature",
                desc: "Beautiful high-definition chromecast testing video showcasing natural elements and light.",
                url: "https://googleapis.com",
                emoji: "🔥"
            }
        ];

        const gridContainer = document.getElementById('grid-container');
        const player = document.getElementById('main-player');
        const videoSource = document.getElementById('video-source');
        const playerTitle = document.getElementById('player-title');
        const playerDesc = document.getElementById('player-desc');

        // Function to display videos in grid
        function loadVideos(videos) {
            gridContainer.innerHTML = "";
            videos.forEach(video => {
                const card = document.createElement('div');
                card.className = 'video-card';
                card.onclick = () => playVideo(video);
                
                card.innerHTML = `
                    <div class="thumbnail-placeholder">${video.emoji}</div>
                    <div class="card-details">
                        <h3>${video.title}</h3>
                        <p>${video.category.toUpperCase()}</p>
                    </div>
                `;
                gridContainer.appendChild(card);
            });
        }

        // Function to play selected video
        function playVideo(video) {
            videoSource.src = video.url;
            playerTitle.innerText = video.title;
            playerDesc.innerText = video.desc;
            player.load();
            player.play();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Filter Function
        function filterVideos(category) {
            // Update Active Button Style
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if(category === 'all') {
                loadVideos(videoList);
            } else {
                const filtered = videoList.filter(v => v.category === category);
                loadVideos(filtered);
            }
        }

        // Initial Load
        loadVideos(videoList);
    </script>
</body>
</html>
