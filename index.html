<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub - Fixed Embedded Player</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background-color: #111; color: #fff; text-align: center; }
        header { display: flex; align-items: center; padding: 20px 40px; background-color: #1a1a1a; border-bottom: 2px solid #222; }
        .blue-circle-logo { width: 40px; height: 40px; background-color: #007bff; border-radius: 50%; box-shadow: 0 0 10px rgba(0, 123, 255, 0.5); margin-right: 15px; }
        .logo-text { font-size: 24px; font-weight: bold; }
        .main-container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        .player-wrapper { background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; padding-bottom: 56.25%; height: 0; }
        /* Iframe settings jo gray box ko khatam karegi */
        iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; background-color: #000; }
        .video-info-box { padding: 20px; background: #1a1a1a; text-align: left; border-radius: 0 0 12px 12px; margin-top: -30px; margin-bottom: 30px; border: 1px solid #222; }
        .video-info-box h2 { color: #007bff; margin-bottom: 5px; }
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; margin-top: 20px; }
        .video-card { background: #1a1a1a; border-radius: 8px; padding: 20px; cursor: pointer; border: 1px solid #222; transition: 0.2s; }
        .video-card:hover { border-color: #007bff; transform: translateY(-3px); }
        .emoji-box { font-size: 40px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="blue-circle-logo"></div>
        <div class="logo-text">Stream<span style="color:#007bff;">Hub</span></div>
    </header>

    <div class="main-container">
        <!-- Embedded Video Player Section -->
        <div class="player-wrapper">
            <!-- Yeh player kabhi block ya gray nahi hoga -->
            <iframe id="main-player" src="https://youtube.com" allowfullscreen></iframe>
        </div>
        <div class="video-info-box">
            <h2 id="player-title">Music Clip Sample</h2>
            <p id="player-desc">Neeche di gayi list se koi bhi video select karke play karein.</p>
        </div>

        <h3 style="text-align: left; margin-bottom: 10px;">Select a Video to Play:</h3>
        
        <!-- Alag alag safe embedded video links -->
        <div class="video-grid">
            <div class="video-card" onclick="changeEmbed('Music Clip Sample', 'A popular open-network backup music video clip.', 'https://youtube.com')">
                <div class="emoji-box">🎵</div>
                <h4>Music Clip</h4>
            </div>
            <div class="video-card" onclick="changeEmbed('Big Buck Bunny (Safe Stream)', 'Classic animation running through a secure streaming link.', 'https://youtube.com')">
                <div class="emoji-box">🐰</div>
                <h4>Bunny Animation</h4>
            </div>
            <div class="video-card" onclick="changeEmbed('Sintel Fantasy Trailer', 'Animated fantasy movie trailer running securely.', 'https://youtube.com')">
                <div class="emoji-box">🐉</div>
                <h4>Sintel Trailer</h4>
            </div>
        </div>
    </div>

    <script>
        function changeEmbed(title, desc, embedUrl) {
            var player = document.getElementById('main-player');
            
            // Iframe ka source change karne ka automatic system
            player.src = embedUrl;
            
            document.getElementById('player-title').innerText = title;
            document.getElementById('player-desc').innerText = desc;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
