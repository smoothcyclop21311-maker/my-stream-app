<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieBox Pro - Ultimate Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #06060a;
            color: #fff;
            padding: 20px;
        }

        /* MovieBox Style Outer Container Main Frame */
        .moviebox-container {
            border: 3px solid #ff0055; /* MovieBox Magenta-Pink Theme Trim Border */
            border-radius: 14px;
            padding: 25px;
            max-width: 1200px;
            margin: 0 auto;
            background-color: #0f0f16;
            box-shadow: 0 15px 40px rgba(255, 0, 85, 0.15);
        }

        /* Top Utility Bar for Copy Button */
        .top-utility-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .top-copy-btn {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }

        .top-copy-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
        }

        /* Header Layout: Logo + App Name Left Par, Search Right Par */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #1f1f2e;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* MovieBox Inspired Gradient Logo Icon */
        .moviebox-logo-circle {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ff0055, #ff5500);
            border-radius: 12px; /* Smooth rounded square like modern app icons */
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }

        .app-title {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Rectangular Search Box from Paint 3D Layout */
        .search-container input {
            width: 260px;
            padding: 10px 15px;
            border: 2px solid #ff0055;
            border-radius: 8px;
            background-color: #161622;
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .search-container input:focus {
            box-shadow: 0 0 10px rgba(255, 0, 85, 0.5);
        }

        /* MovieBox Cinema Dynamic Overlay Video Window */
        .cinema-player-wrapper {
            background: #000;
            border: 2px solid #ff0055;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.9);
            display: none; /* Triggers active smoothly upon selecting card data assets */
        }

        .player-viewport {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Cinema Aspect Ratio Frame */
            height: 0;
            background-color: #000;
        }

        .player-viewport iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* MovieBox Style Player Control Info Track Strip */
        .cinema-info-strip {
            background: #13131f;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-top: 1px solid #1f1f30;
        }

        .cinema-icon { font-size: 24px; }
        .track-meta { text-align: left; flex: 1; }
        .track-meta h3 { color: #ff0055; font-size: 18px; margin-bottom: 2px; font-weight: bold; }
        .track-meta p { color: #999; font-size: 12px; }

        /* Headings Font Style */
        .section-title {
            font-size: 24px;
            text-align: left;
            margin-bottom: 20px;
            margin-top: 25px;
            font-weight: 700;
            text-transform: capitalize;
            color: #ff0055;
            letter-spacing: 0.5px;
        }

        /* 4-Column Linear Dashboard Grid Items Box */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .movie-card {
            border: 2px solid #1f1f30;
            border-radius: 10px;
            background-color: #13131f;
            height: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 15px;
        }

        .movie-card:hover {
            border-color: #ff0055;
            background-color: #1a1a2b;
            transform: translateY(-4px);
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.2);
        }

        .card-icon { font-size: 36px; margin-bottom: 8px; }
        .card-name { font-size: 14px; font-weight: 600; color: #e5e5e9; text-align: center; }

        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
            header { flex-direction: column; gap: 15px; align-items: flex-start; }
            .search-container input { width: 100%; }
        }
    </style>
</head>
