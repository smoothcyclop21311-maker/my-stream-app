<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream App - Custom Homepage</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0d13;
            color: #fff;
            padding: 20px;
        }

        /* Border Box jaise aapke sketch mein hai */
        .container-border {
            border: 4px solid #ffffff;
            border-radius: 12px;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
            background-color: #13131a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Top Header Area: Logo, Name aur Search Bar */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #1f1f2e;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Aapka manga hua Blue Circle Logo */
        .blue-circle {
            width: 35px;
            height: 35px;
            background-color: #007bff;
            border-radius: 50%;
            box-shadow: 0 0 15px #007bff;
        }

        .app-title {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Search Bar jaise aapne sketch mein draw kiya */
        .search-container input {
            width: 250px;
            padding: 10px 15px;
            border: 2px solid #ffffff;
            border-radius: 6px;
            background-color: #1e1e2a;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .search-container input:focus {
            border-color: #007bff;
        }

        /* Headings Design (animations movie & anime) */
        .section-title {
            font-size: 26px;
            text-align: left;
            margin-bottom: 20px;
            margin-top: 20px;
            color: #ffffff;
            font-style: italic;
            border-left: 4px solid #007bff;
            padding-left: 10px;
        }

        /* 4 Blocks Grid Layout (Jaise aapke sketch mein 4-4 boxes hain) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        /* Grid ke rectangular boxes */
        .movie-card {
            border: 2px solid #ffffff;
            border-radius: 8px;
            background-color: #1e1e2a;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.3s ease;
            padding: 10px;
        }

        .movie-card:hover {
            border-color: #007bff;
            transform: scale(1.05);
            background-color: #252538;
        }

        .card-icon {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .card-name {
            font-size: 14px;
            font-weight: bold;
            color: #e0e0e0;
        }

        /* Responsive designing taaki mobile par kharab na ho */
        @media (max-width: 768px) {
            .cards-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            header {
                flex-direction: column;
                gap: 20px;
                align-items: flex-start;
            }
            .search-container input {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Main Outer Border Content -->
    <div class="container-border">
        
        <!-- Header: Logo + Title + Search -->
        <header>
            <div class="logo-section">
                <div class="blue-circle"></div>
                <div class="app-title">stream app</div>
            </div>
            <div class="search-container">
                <input type="text" placeholder="search...">
            </div>
        </header>

        <!-- Section 1: Animations Movie -->
        <div class="section-title">animations movie</div>
        <div class="cards-grid">
            <div class="movie-card" onclick="alert('Playing Animation Movie 1')">
                <div class="card-icon">🦁</div>
                <div class="card-name">Lion King Clip</div>
            </div>
            <div class="movie-card" onclick="alert('Playing Animation Movie 2')">
                <div class="card-icon">🐰</div>
                <div class="card-name">Bunny Story</div>
            </div>
            <div class="movie-card" onclick="alert('Playing Animation Movie 3')">
                <div class="card-icon">🐼</div>
                <div class="card-name">Kung Fu Panda</div>
            </div>
            <div class="movie-card" onclick="alert('Playing Animation Movie 4')">
                <div class="card-icon">🚗</div>
                <div class="card-name">Cars Movie</div>
            </div>
        </div>

        <!-- Section 2: Anime -->
        <div class="section-title">anime</div>
        <div class="cards-grid">
            <div class="movie-card" onclick="alert('Opening One Piece Hindi Dub')">
                <div class="card-icon">🏴‍☠️</div>
                <div class="card-name">One Piece (Hindi)</div>
            </div>
            <div class="movie-card" onclick="alert('Opening One Piece English Dub')">
                <div class="card-icon">👑</div>
                <div class="card-name">One Piece (English)</div>
            </div>
            <div class="movie-card" onclick="alert('Opening Naruto Hindi Dub')">
                <div class="card-icon">🦊</div>
                <div class="card-name">Naruto (Hindi)</div>
            </div>
            <div class="movie-card" onclick="alert('Opening Death Note Hindi Dub')">
                <div class="card-icon">📓</div>
                <div class="card-name">Death Note (Hindi)</div>
            </div>
        </div>

    </div>

</body>
</html>
