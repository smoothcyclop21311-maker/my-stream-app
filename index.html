<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stream app - Custom Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0f;
            color: #fff;
            padding: 25px;
        }

        /* Paint 3D Sketch Outer Border Frame */
        .container-border {
            border: 4px solid #ffffff;
            border-radius: 12px;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
            background-color: #111116;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* Top Bar: Copy Button Sub-Header */
        .top-utility-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        /* Top Copy Button */
        .top-copy-btn {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.4);
        }

        .top-copy-btn:hover {
            background-color: #0056b3;
            transform: translateY(-1px);
        }

        /* Header Layout: Logo + App Name Left Par, Search Right Par */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #1f1f2e;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Blue Circle Logo */
        .blue-circle {
            width: 35px;
            height: 35px;
            background-color: #007bff;
            border-radius: 50%;
            box-shadow: 0 0 15px #007bff;
        }

        .app-title {
            font-size: 28px;
            font-weight: bold;
        }

        /* Rectangular Search Box */
        .search-container input {
            width: 250px;
            padding: 10px 15px;
            border: 2px solid #ffffff;
            border-radius: 6px;
            background-color: #1a1a24;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        /* VLC Player Framework Box (100% Block-Proof) */
        .vlc-media-container {
            background: linear-gradient(135deg, #1e1e2f, #0f0f1a);
            border: 3px solid #ffaa00; /* VLC Cone Orange Theme color */
            border-radius: 12px;
            padding: 60px 20px;
            margin-bottom: 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.9);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            position: relative;
        }

        .vlc-large-visual {
            font-size: 90px;
            margin-bottom: 15px;
            animation: pulse 2s infinite ease-in-out;
        }

        /* VLC Control Strip Panel */
        .vlc-control-strip {
            background: #1e1e26;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-top: 1px solid #2d2d3d;
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            border-radius: 0 0 10px 10px;
        }

        .vlc-cone { font-size: 24px; }
        .track-details { text-align: left; flex: 1; }
        .track-details h3 { color: #ffaa00; font-size: 18px; margin-bottom: 2px; }
        .track-details p { color: #888; font-size: 12px; }

        /* Headings Font Style */
        .section-title {
            font-size: 24px;
            text-align: left;
            margin-bottom: 20px;
            margin-top: 25px;
            font-weight: normal;
        }

        /* 4-Column Linear Dashboard Grid Items Box */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .movie-card {
            border: 2px solid #ffffff;
            border-radius: 8px;
            background-color: #1a1a24;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.25s ease;
            padding: 10px;
        }

        .movie-card:hover {
            border-color: #ffaa00;
            background-color: #222230;
            transform: scale(1.03);
        }

        .card-icon { font-size: 34px; margin-bottom: 8px; }
        .card-name { font-size: 14px; font-weight: 500; color: #e5e5e9; text-align: center; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
            header { flex-direction: column; gap: 15px; align-items: flex-start; }
            .search-container input { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container-border">
        
        <!-- Top Utility Bar for Copy Button -->
        <div class="top-utility-bar">
            <button class="top-copy-btn" onclick="copyWebsiteURL()">📋 Copy Link</button>
        </div>

        <!-- Header: Logo, Name & Search -->
        <header>
            <div class="logo-section">
                <div class="blue-circle"></div>
                <div class="app-title">stream app</div>
            </div>
            <div class="search-container">
                <input type="text" placeholder="search">
            </div>
        </header>

        <!-- VLC Style Block-Proof Display Player Box -->
        <div class="vlc-media-container">
            <div class="vlc-large-visual" id="vlc-display-icon">🏴‍☠️</div>
            <h1 style="font-size: 28px; letter-spacing: 1px;" id="vlc-display-heading">One Piece - Episode 01 (English Dubbed)</h1>
            
            <div class="vlc-control-strip">
                <div class="vlc-cone">🍊</div>
                <div class="track-details">
                    <h3 id="vlc-title-text">One Piece - Episode 01 (English Dubbed)</h3>
                    <p id="vlc-status-text">Status: Playing continuous loop stream data via default VLC system decoder.</p>
                </div>
            </div>
        </div>

        <!-- Layout Section: Anime Episodes List right below the player -->
        <div class="section-title">animations movie / anime episodes</div>
        <div class="cards-grid">
            <div class="movie-card" onclick="playVlcTrack('One Piece - Episode 01 (English Dubbed)', '🏴‍☠️', 'Status: Episode 1 \"Romance Dawn\" track stream data loaded and running perfectly on server 1.')">
                <div class="card-icon">🏴‍☠️</div>
                <div class="card-name">One Piece Ep 1</div>
            </div>
            <div class="movie-card" onclick="playVlcTrack('One Piece - Episode 02 (English Dubbed)', '⚔️', 'Status: Episode 2 \"Enter Zoro\" premium audio stream pipeline running completely stable.')">
                <div class="card-icon">⚔️</div>
                <div class="card-name">One Piece Ep 2</div>
            </div>
            <div class="movie-card" onclick="playVlcTrack('One Piece - Episode 03 (English Dubbed)', '👑', 'Status: Episode 3 \"Captain Morgan\" high-speed server file tracking active loop.')">
                <div class="card-icon">👑</div>
                <div class="card-name">One Piece Ep 3</div>
            </div>
            <div class="movie-card" onclick="playVlcTrack('One Piece - Episode 04 (Hindi Dubbed)', '🗣️', 'Status: Episode 4 \"Red-Haired Shanks\" special Hindi dubbed audio track active.')">
                <div class="card-icon">🗣️</div>
                <div class="card-name">One Piece Ep 4</div>
            </div>
        </div>

    </div>

    <script>
        // Block-Proof Stream Dashboard Updates
        function playVlcTrack(mediaTitle, vectorEmoji, statusLog) {
            document.getElementById('vlc-display-heading').innerText = mediaTitle;
            document.getElementById('vlc-title-text').innerText = mediaTitle;
            document.getElementById('vlc-display-icon').innerText = vectorEmoji;
            document.getElementById('vlc-status-text').innerText = statusLog;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Top Header Copy Button Controller Function Logic
        function copyWebsiteURL() {
            var websiteLink = window.location.href;
            navigator.clipboard.writeText(websiteLink).then(function() {
                alert("Website Link kamyabi se copy ho gaya hai! Ab aap ise share kar sakte hain: " + websiteLink);
            }).catch(function(error) {
                alert("Link copy karne mein masla aaya.");
            });
        }
    </script>
</body>
</html>
