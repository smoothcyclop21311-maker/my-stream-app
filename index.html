<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieBox - One Piece Stream</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #06060a;
            color: #fff;
            padding: 20px;
        }

        /* MovieBox Main White Border Frame */
        .moviebox-container {
            border: 4px solid #ffffff;
            border-radius: 14px;
            padding: 25px;
            max-width: 1200px;
            margin: 0 auto;
            background-color: #0f0f16;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
        }

        /* Top Copy Button */
        .top-utility-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .top-copy-btn {
            background: linear-gradient(135deg, #ff0055, #ff5500);
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }

        /* Header Layout: Logo + App Name Left, Search Right */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #1f1f2e;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .moviebox-logo-circle {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #ff0055, #ff5500);
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }

        .app-title {
            font-size: 28px;
            font-weight: 800;
        }

        /* Search Bar */
        .search-container input {
            width: 250px;
            padding: 10px 15px;
            border: 2px solid #ffffff;
            border-radius: 8px;
            background-color: #161622;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        /* Auto-Playing Video Container (MovieBox Style) */
        .cinema-player-wrapper {
            background: #000;
            border: 3px solid #ff0055;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.9);
        }

        .player-viewport {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            background-color: #000;
        }

        .player-viewport iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .cinema-info-strip {
            background: #13131f;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-top: 1px solid #1f1f30;
        }

        .track-meta h3 { color: #ff0055; font-size: 18px; margin-bottom: 2px; font-weight: bold; }
        .track-meta p { color: #999; font-size: 12px; }

        /* Section Headings */
        .section-title {
            font-size: 24px;
            text-align: left;
            margin-bottom: 20px;
            margin-top: 25px;
            font-weight: 700;
            color: #ffffff;
        }

        /* Episodes Grid Layout (Boxes right below the video player) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .movie-card {
            border: 2px solid #ffffff;
            border-radius: 10px;
            background-color: #13131f;
            height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.23s ease;
            padding: 15px;
        }

        .movie-card:hover {
            border-color: #ff0055;
            background-color: #1a1a2b;
            transform: translateY(-3px);
        }

        .card-icon { font-size: 32px; margin-bottom: 5px; }
        .card-name { font-size: 14px; font-weight: 600; color: #e5e5e9; text-align: center; }

        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
            header { flex-direction: column; gap: 15px; align-items: flex-start; }
            .search-container input { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="moviebox-container">
        
        <!-- Top Copy Button -->
        <div class="top-utility-bar">
            <button class="top-copy-btn" onclick="copyMovieBoxURL()">📋 Copy Link</button>
        </div>

        <!-- Header Layout -->
        <header>
            <div class="logo-section">
                <div class="moviebox-logo-circle">M</div>
                <div class="app-title">stream app</div>
            </div>
            <div class="search-container">
                <input type="text" placeholder="search">
            </div>
        </header>

        <!-- Auto-playing MovieBox Stream Player (App open hote hi chale gaa) -->
        <div class="cinema-player-wrapper">
            <div class="player-viewport">
                <!-- Is link mein autoplay=1 set hai, page open hote hi background video start ho jayegi -->
                <iframe id="cinema-iframe-stream" src="https://vimeo.com" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <div class="cinema-info-strip">
                <div class="cinema-icon">🎬</div>
                <div class="track-meta">
                    <h3 id="cinema-title-node">One Piece - Episode 01 (English Dubbed)</h3>
                    <p id="cinema-status-node">App opened successfully. Streaming automatic pilot load track.</p>
                </div>
            </div>
        </div>

        <!-- Episodes List below the video player -->
        <div class="section-title">animations movie / anime episodes</div>
        <div class="cards-grid">
            <div class="movie-card" onclick="loadEpisode('One Piece - Episode 01 (English)', 'https://vimeo.com', 'Episode 1: Romance Dawn - Luffy\'s journey begins!')">
                <div class="card-icon">🏴‍☠️</div>
                <div class="card-name">One Piece Ep 1</div>
            </div>
            <div class="movie-card" onclick="loadEpisode('One Piece - Episode 02 (English)', 'https://vimeo.com', 'Episode 2: Enter Zoro - The Pirate Hunter.')">
                <div class="card-icon">⚔️</div>
                <div class="card-name">One Piece Ep 2</div>
            </div>
            <div class="movie-card" onclick="loadEpisode('One Piece - Episode 03 (English)', 'https://vimeo.com', 'Episode 3: Captain Morgan vs Luffy battle!')">
                <div class="card-icon">👑</div>
                <div class="card-name">One Piece Ep 3</div>
            </div>
            <div class="movie-card" onclick="loadEpisode('One Piece - Episode 04 (Hindi Dub)', 'https://vimeo.com', 'Episode 4: Red-Haired Shanks - The Straw Hat legacy.')">
                <div class="card-icon">🗣️</div>
                <div class="card-name">One Piece Ep 4</div>
            </div>
        </div>

    </div>

    <script>
        // Switch between episodes dynamically
        function loadEpisode(episodeTitle, videoUrl, description) {
            var targetIframe = document.getElementById('cinema-iframe-stream');
            targetIframe.src = videoUrl;
            document.getElementById('cinema-title-node').innerText = episodeTitle + " - MovieBox Player";
            document.getElementById('cinema-status-node').innerText = description;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Top Copy URL Logic
        function copyMovieBoxURL() {
            var currentURLString = window.location.href;
            navigator.clipboard.writeText(currentURLString).then(function() {
                alert("MovieBox App Link successfully copied: " + currentURLString);
            }).catch(function(e) {
                alert("Link copy error.");
            });
        }
    </script>
</body>
</html>
