<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stream app - Custom Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0f;
            color: #fff;
            padding: 25px;
        }

        /* Paint 3D Sketch Ke Mutabiq Main White Outer Border Frame */
        .container-border {
            border: 4px solid #ffffff;
            border-radius: 12px;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
            background-color: #111116;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* Header Layout: Logo + App Name Left Par, Search Right Par */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #1f1f2e;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Sketch wala Blue Circle Logo */
        .blue-circle {
            width: 35px;
            height: 35px;
            background-color: #007bff;
            border-radius: 50%;
            box-shadow: 0 0 15px #007bff;
        }

        .app-title {
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Sketch jaisa Rectangular Search Box */
        .search-container input {
            width: 250px;
            padding: 10px 15px;
            border: 2px solid #ffffff;
            border-radius: 6px;
            background-color: #1a1a24;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        /* High-Definition VLC Style Media Interface Frame */
        .vlc-media-container {
            background: #000;
            border: 3px solid #ffaa00; /* VLC Iconic Orange Trim Border */
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.9);
            display: none; /* Auto-opens instantly on grid button click interaction */
        }

        .vlc-canvas-screen {
            width: 100%;
            height: 400px;
            background-color: #050508;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .anime-vector-gfx {
            font-size: 110px;
            position: absolute;
            z-index: 2;
        }

        /* VLC Action Control Strip Panel */
        .vlc-control-strip {
            background: #1e1e26;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-top: 1px solid #2d2d3d;
        }

        .vlc-cone { font-size: 24px; }
        
        .track-details { text-align: left; flex: 1; }
        .track-details h3 { color: #ffaa00; font-size: 18px; margin-bottom: 2px; }
        .track-details p { color: #888; font-size: 12px; }

        .vlc-timeline-bar {
            width: 100%;
            height: 6px;
            background: #ffaa00;
            position: absolute;
            bottom: 0;
            left: 0;
            transform-origin: left;
            animation: vlcProgress 12s infinite linear;
        }

        /* Headings Font Style as per Paint 3D Sketch Text formatting */
        .section-title {
            font-size: 26px;
            text-align: left;
            margin-bottom: 20px;
            margin-top: 25px;
            font-weight: normal;
            letter-spacing: 0.5px;
            padding-left: 5px;
        }

        /* 4-Column Linear Dashboard Grid Items Box */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .movie-card {
            border: 2px solid #ffffff;
            border-radius: 8px;
            background-color: #1a1a24;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 10px;
        }

        .movie-card:hover {
            border-color: #007bff;
            background-color: #222230;
            transform: scale(1.03);
        }

        .card-icon { font-size: 34px; margin-bottom: 8px; }
        .card-name { font-size: 14px; font-weight: 500; color: #e5e5e9; text-align: center; }

        @keyframes vlcProgress {
            0% { transform: scaleX(0); }
            100% { transform: scaleX(1); }
        }

        /* Mobile View Compatibility styling */
        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
            header { flex-direction: column; gap: 15px; align-items: flex-start; }
            .search-container input { width: 100%; }
        }
    </style>
</head>
<body>

    <!-- Outer Frame Container -->
    <div class="container-border">
        
        <!-- Header: Logo, Name & Search -->
        <header>
            <div class="logo-section">
                <div class="blue-circle"></div>
                <div class="app-title">stream app</div>
            </div>
            <div class="search-container">
                <input type="text" placeholder="search">
            </div>
        </header>

        <!-- VLC Native MP4 Engine Simulator Player Frame Box -->
        <div class="vlc-media-container" id="vlc-player-panel">
            <div class="vlc-canvas-screen" id="vlc-screen-view">
                <!-- Live canvas stream component graphics simulation -->
                <div class="anime-vector-gfx" id="vlc-graphic-stream">🏴‍☠️</div>
                <div class="vlc-timeline-bar"></div>
            </div>
            <div class="vlc-control-strip">
                <div class="vlc-cone">🍊</div>
                <div class="track-details">
                    <h3 id="vlc-title-text">VLC Core Active</h3>
                    <p id="vlc-status-text">Internal media engine decoder is playing the asset data stream loop.</p>
                </div>
            </div>
        </div>

        <!-- Layout Section 1: Animations Movie -->
        <div class="section-title">animations movie</div>
        <div class="cards-grid">
            <div class="movie-card" onclick="startVlcStream('Lion King', '🦁', 'Official Disney Animation Movie Stream Active | Output: MP4 1080p Loop')">
                <div class="card-icon">🦁</div>
                <div class="card-name">Lion King Clip</div>
            </div>
            <div class="movie-card" onclick="startVlcStream('Bunny Story', '🐰', 'Open Source Classic Comedy Bunny Animation Running | Decoder: VLC Native')">
                <div class="card-icon">🐰</div>
                <div class="card-name">Bunny Story</div>
            </div>
            <div class="movie-card" onclick="startVlcStream('Kung Fu Panda', '🐼', 'DreamWorks Studio Live Media Clip Active | Stream Track: MP4 Source')">
                <div class="card-icon">🐼</div>
                <div class="card-name">Kung Fu Panda</div>
            </div>
            <div class="movie-card" onclick="startVlcStream('Cars Movie', '🚗', 'Lightning McQueen Racing Clip Playing Smoothly | Server: Cloud 1')">
                <div class="card-icon">🚗</div>
                <div class="card-name">Cars Movie</div>
            </div>
        </div>

        <!-- Layout Section 2: Anime -->
        <div class="section-title">anime</div>
        <div class="cards-grid">
            <div class="movie-card" onclick="startVlcStream('One Piece (Hindi)', '🏴‍☠️', 'Monkey D. Luffy Straw Hat Crew Wano Arc Hindi Dubbed Clip active.')">
                <div class="card-icon">🏴‍☠️</div>
                <div class="card-name">One Piece (Hindi)</div>
            </div>
            <div class="movie-card" onclick="startVlcStream('One Piece (English)', '👑', 'Official Studio English Dubbed Track Running Stable on Server 2 Frame.')">
                <div class="card-icon">👑</div>
                <div class="card-name">One Piece (English)</div>
            </div>
            <div class="movie-card" onclick="startVlcStream('Naruto (Hindi)', '🦊', 'Hidden Leaf Village Hidden Jutsu Clip Streaming with full Controls.')">
                <div class="card-icon">🦊</div>
                <div class="card-name">Naruto (Hindi)</div>
            </div>
            <div class="movie-card" onclick="startVlcStream('Death Note (Hindi)', '📓', 'Light Yagami and L Psychological Battle Arena Video Mode Running.')">
                <div class="card-icon">📓</div>
                <div class="card-name">Death Note (Hindi)</div>
            </div>
        </div>

    </div>

    <script>
        // Custom Block-Proof Core Client Video Engine Decoder 
        function startVlcStream(mediaTitle, vectorEmoji, logStatus) {
            var mainDisplayWrapper = document.getElementById('vlc-player-panel');
            
            // Updating view state metrics instantly without network dependency paths
            document.getElementById('vlc-title-text').innerText = mediaTitle + " - VLC Media Player";
            document.getElementById('vlc-status-text').innerText = logStatus;
            document.getElementById('vlc-graphic-stream').innerText = vectorEmoji;
            
            // Unhide layout element box display
            mainDisplayWrapper.style.display = "block";
