<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeHub - Hindi & English Dubbed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d0d13; color: #fff; text-align: center; }
        
        /* Header & Blue Circle Logo */
        header { display: flex; align-items: center; padding: 20px 40px; background-color: #13131a; border-bottom: 2px solid #1f1f2e; }
        .blue-circle-logo { width: 40px; height: 40px; background-color: #007bff; border-radius: 50%; box-shadow: 0 0 15px rgba(0, 123, 255, 0.6); margin-right: 15px; }
        .logo-text { font-size: 24px; font-weight: bold; letter-spacing: 1px; }

        .main-container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }
        
        /* Video Player Container */
        .player-wrapper { background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 1px solid #1f1f2e; }
        video { width: 100%; display: block; max-height: 500px; background-color: #000; }
        
        .video-info { padding: 20px; background: #13131a; text-align: left; }
        .video-info h2 { color: #007bff; margin-bottom: 5px; }
        .audio-tag { display: inline-block; background: #ffc107; color: #000; font-weight: bold; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 10px; }

        /* Anime Cards Grid */
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-top: 20px; }
        .anime-card { background: #13131a; border-radius: 10px; padding: 20px; border: 1px solid #1f1f2e; transition: 0.3s; text-align: left; }
        .anime-card:hover { border-color: #007bff; transform: translateY(-5px); }
        .anime-title { font-size: 18px; margin-bottom: 15px; font-weight: bold; color: #fff; }
        
        /* Language Selection Buttons */
        .btn-group { display: flex; gap: 10px; }
        .lang-btn { flex: 1; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn-hindi { background-color: #28a745; color: white; }
        .btn-hindi:hover { background-color: #218838; }
        .btn-english { background-color: #17a2b8; color: white; }
        .btn-english:hover { background-color: #138496; }
        
        .section-title { text-align: left; margin-bottom: 15px; color: #8f8fbc; font-size: 20px; }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="blue-circle-logo"></div>
        <div class="logo-text">Anime<span style="color:#007bff;">Hub</span></div>
    </header>

    <div class="main-container">
        <!-- Main Video Player -->
        <div class="player-wrapper">
            <video id="anime-player" controls autoplay playsinline>
                <source id="video-source" src="https://w3schools.com" type="video/mp4">
                Your browser does not support video.
            </video>
            <div class="video-info">
                <span id="player-audio" class="audio-tag">Playing: Hindi Dubbed</span>
                <h2 id="player-title">One Piece - Welcome Clip</h2>
                <p id="player-desc">Neeche di gayi list se apna pasandida Anime aur audio select karein.</p>
            </div>
        </div>

        <h3 class="section-title">Browse Anime Series:</h3>
        
        <!-- Anime List with Hindi & English Options -->
        <div class="anime-grid">
            
            <!-- Anime Card 1 -->
            <div class="anime-card">
                <div class="anime-title">🏴‍☠️ One Piece (Season 1)</div>
                <div class="btn-group">
                    <button class="lang-btn btn-hindi" onclick="playAnime('One Piece (Hindi)', 'Hindi Dubbed', 'https://w3schools.com', 'Luffy aur uski crew ki adventure ka exclusive Hindi clip.')">🗣️ Hindi Dub</button>
                    <button class="lang-btn btn-english" onclick="playAnime('One Piece (English)', 'English Dubbed', 'https://w3schools.com', 'Watch the action-packed adventure clip with English audio.')">🇬🇧 English Dub</button>
                </div>
            </div>

            <!-- Anime Card 2 -->
            <div class="anime-card">
                <div class="anime-title">🦊 Naruto Shippuden</div>
                <div class="btn-group">
                    <button class="lang-btn btn-hindi" onclick="playAnime('Naruto (Hindi)', 'Hindi Dubbed', 'https://w3schools.com', 'Hidden Leaf village ke ninja Naruto ka special Hindi dubbed clip.')">🗣️ Hindi Dub</button>
                    <button class="lang-btn btn-english" onclick="playAnime('Naruto (English)', 'English Dubbed', 'https://w3schools.com', 'Epic ninja battles and stories with high-quality English audio.')">🇬🇧 English Dub</button>
                </div>
            </div>

            <!-- Anime Card 3 -->
            <div class="anime-card">
                <div class="anime-title">📓 Death Note</div>
                <div class="btn-group">
                    <button class="lang-btn btn-hindi" onclick="playAnime('Death Note (Hindi)', 'Hindi Dubbed', 'https://w3schools.com', 'Light Yagami aur L ki zehni jung ka behtareen Hindi dubbed clip.')">🗣️ Hindi Dub</button>
                    <button class="lang-btn btn-english" onclick="playAnime('Death Note (English)', 'English Dubbed', 'https://w3schools.com', 'The psychological thriller clip with official English dubbing.')">🇬🇧 English Dub</button>
                </div>
            </div>

        </div>
    </div>

    <script>
        function playAnime(title, audioType, url, description) {
            var video = document.getElementById('anime-player');
            var source = document.getElementById('video-source');
            
            video.pause();
            source.src = url;
            video.load();
            
            document.getElementById('player-title').innerText = title;
            document.getElementById('player-audio').innerText = "Playing: " + audioType;
            document.getElementById('player-desc').innerText = description;
            
            // Safe trigger to handle browser blocks
            setTimeout(function() {
                video.play().catch(function(err) {
                    console.log("Playback interaction needed.");
                });
            }, 100);
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
