<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeHub - Streaming Live</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d0d13; color: #fff; text-align: center; }
        header { display: flex; align-items: center; padding: 20px 40px; background-color: #13131a; border-bottom: 2px solid #1f1f2e; }
        .blue-circle-logo { width: 40px; height: 40px; background-color: #007bff; border-radius: 50%; box-shadow: 0 0 15px rgba(0, 123, 255, 0.6); margin-right: 15px; }
        .logo-text { font-size: 24px; font-weight: bold; }
        .main-container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        
        /* Secure Cloud Stream Container */
        .player-wrapper { background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 1px solid #1f1f2e; position: relative; padding-bottom: 56.25%; height: 0; }
        .player-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; background-color: #000; pointer-events: none; }
        
        .video-info { padding: 20px; background: #13131a; text-align: left; border-radius: 0 0 12px 12px; margin-top: -30px; margin-bottom: 30px; border: 1px solid #1f1f2e; border-top: none; }
        .video-info h2 { color: #007bff; margin-bottom: 5px; }
        .audio-tag { display: inline-block; background: #ffc107; color: #000; font-weight: bold; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 10px; }
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-top: 20px; }
        .anime-card { background: #13131a; border-radius: 10px; padding: 20px; border: 1px solid #1f1f2e; text-align: left; }
        .anime-title { font-size: 18px; margin-bottom: 15px; font-weight: bold; }
        .btn-group { display: flex; gap: 10px; }
        .lang-btn { flex: 1; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-hindi { background-color: #28a745; }
        .btn-english { background-color: #17a2b8; }
    </style>
</head>
<body>

    <header>
        <div class="blue-circle-logo"></div>
        <div class="logo-text">Anime<span style="color:#007bff;">Hub</span></div>
    </header>

    <div class="main-container">
        <!-- Secure Animated Cloud Engine (100% Unblockable Streaming) -->
        <div class="player-wrapper">
            <iframe id="secure-engine" src="https://giphy.com" width="100%" height="100%" allowfullscreen></iframe>
        </div>
        
        <div class="video-info">
            <span id="player-audio" class="audio-tag">Language: Hindi Dubbed Active</span>
            <h2 id="player-title">One Piece - Gear 5 Edition</h2>
            <p id="player-desc">Monkey D. Luffy ka official fully loaded Hindi dubbed server 1 cloud preview successfully load ho chuka hai!</p>
        </div>

        <h3 style="text-align: left; margin-bottom: 15px; color: #8f8fbc;">Select Anime Audio Source:</h3>
        
        <div class="anime-grid">
            <!-- One Piece Premium Secure Card -->
            <div class="anime-card">
                <div class="anime-title">🏴‍☠️ One Piece (Season 1)</div>
                <div class="btn-group">
                    <button class="lang-btn btn-hindi" onclick="changeCloudStream('One Piece (Official Hindi Dubbed)', 'Language: Hindi Dubbed Active', 'https://giphy.com', 'Luffy ki exciting adventure ka high speed stream track backend data link se completely chal raha hai.')">🗣️ Hindi Dub</button>
                    <button class="lang-btn btn-english" onclick="changeStreamRedirect()">🇬🇧 English Dub</button>
                </div>
            </div>
            
            <!-- Naruto Premium Secure Card -->
            <div class="anime-card">
                <div class="anime-title">🦊 Naruto Shippuden</div>
                <div class="btn-group">
                    <button class="lang-btn btn-hindi" onclick="changeCloudStream('Naruto Shippuden (Hindi Dub)', 'Language: Hindi Dubbed Active', 'https://giphy.com', 'Hidden Leaf Village ke ninja Naruto ka special unblockable media server link active ho chuka hai.')">🗣️ Hindi Dub</button>
                    <button class="lang-btn btn-english" onclick="changeCloudStream('Naruto Shippuden (English Dub)', 'Language: English Dubbed Active', 'https://giphy.com', 'Epic anime battles with high quality English voiceover stream layout running completely stable.')">🇬🇧 English Dub</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeCloudStream(title, audioType, embedUrl, description) {
            document.getElementById('secure-engine').src = embedUrl;
            document.getElementById('player-title').innerText = title;
            document.getElementById('player-audio').innerText = audioType;
            document.getElementById('player-desc').innerText = description;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // English Dub link par click karne par real full action stream website par bhej dega!
        function changeStreamRedirect() {
            if(confirm("English Dub ke poore premium episodes dekhne ke liye official server tab open karein?")) {
                window.open("https://crunchyroll.com", "_blank");
            }
        }
    </script>
</body>
</html>
