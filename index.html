<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeHub - One Piece Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #0d0d13; color: #fff; text-align: center; }
        header { display: flex; align-items: center; padding: 20px 40px; background-color: #13131a; border-bottom: 2px solid #1f1f2e; }
        .blue-circle-logo { width: 40px; height: 40px; background-color: #007bff; border-radius: 50%; box-shadow: 0 0 15px rgba(0, 123, 255, 0.6); margin-right: 15px; }
        .logo-text { font-size: 24px; font-weight: bold; }
        .main-container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        
        /* Fixed Video Player Frame */
        .player-container { background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 1px solid #1f1f2e; position: relative; padding-bottom: 56.25%; height: 0; }
        .player-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; background-color: #000; }
        
        .video-info { padding: 20px; background: #13131a; text-align: left; border-radius: 0 0 12px 12px; margin-top: -30px; margin-bottom: 30px; border: 1px solid #1f1f2e; border-top: none; }
        .video-info h2 { color: #007bff; margin-bottom: 5px; }
        .audio-tag { display: inline-block; background: #ffc107; color: #000; font-weight: bold; padding: 3px 8px; border-radius: 4px; font-size: 12px; margin-bottom: 10px; }
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 25px; margin-top: 20px; }
        .anime-card { background: #13131a; border-radius: 10px; padding: 20px; border: 1px solid #1f1f2e; text-align: left; }
        .anime-title { font-size: 18px; margin-bottom: 15px; font-weight: bold; }
        .btn-group { display: flex; gap: 10px; }
        .lang-btn { flex: 1; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-hindi { background-color: #28a745; }
        .btn-english { background-color: #17a2b8; }
    </style>
</head>
<body>

    <header>
        <div class="blue-circle-logo"></div>
        <div class="logo-text">Anime<span style="color:#007bff;">Hub</span></div>
    </header>

    <div class="main-container">
        <!-- Google Open Sandbox Video Embed System -->
        <div class="player-container">
            <!-- Starting video: Official One Piece Clip via safe embed code -->
            <iframe id="secure-player" src="https://youtube-nocookie.com" allowfullscreen></iframe>
        </div>
        
        <div class="video-info">
            <span id="player-audio" class="audio-tag">Playing: One Piece Official Trailer</span>
            <h2 id="player-title">One Piece (English Sub/Dub)</h2>
            <p id="player-desc">Monkey D. Luffy ka official legal preview video load ho chuka hai. Video player ke center mein play icon par click karein!</p>
        </div>

        <h3 style="text-align: left; margin-bottom: 15px; color: #8f8fbc;">Select Anime Language:</h3>
        
        <div class="anime-grid">
            <!-- One Piece Card with Direct No-Cookie Safe Links -->
            <div class="anime-card">
                <div class="anime-title">🏴‍☠️ One Piece (Wano Arc)</div>
                <div class="btn-group">
                    <button class="lang-btn btn-hindi" onclick="changeStream('One Piece (Hindi Concept Clip)', 'Hindi Audio Info Loaded', 'https://youtube-nocookie.com', 'One Piece series ka exciting clip loading. Upar player ke beech mein play ▷ par click karein.')">🗣️ Hindi Dub</button>
                    <button class="lang-btn btn-english" onclick="changeStream('One Piece (Official English Promo)', 'English Audio Stream Active', 'https://youtube-nocookie.com', 'Official English trailer version successfully loaded. Upar play icon daba kar stream karein.')">🇬🇧 English Dub</button>
                </div>
            </div>
            
            <!-- Naruto Card -->
            <div class="anime-card">
                <div class="anime-title">🦊 Naruto Shippuden</div>
                <div class="btn-group">
                    <button class="lang-btn btn-hindi" onclick="changeStream('Naruto (Hindi Fan-Dub Intro)', 'Hindi Audio Info Loaded', 'https://youtube-nocookie.com', 'Ninja series Naruto ka special video content. Upar screen par play button dabayein.')">🗣️ Hindi Dub</button>
                    <button class="lang-btn btn-english" onclick="changeStream('Naruto (Official English Promo)', 'English Audio Stream Active', 'https://youtube-nocookie.com', 'Naruto trailer stream active. Player ke center play icon par touch karein.')">🇬🇧 English Dub</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function changeStream(title, audioType, embedUrl, description) {
            var player = document.getElementById('secure-player');
            player.src = embedUrl;
            
            document.getElementById('player-title').innerText = title;
            document.getElementById('player-audio').innerText = audioType;
            document.getElementById('player-desc').innerText = description;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
