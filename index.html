<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>stream app - Custom Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0f;
            color: #fff;
            padding: 25px;
        }

        /* Paint 3D Sketch Outer Border Frame */
        .container-border {
            border: 4px solid #ffffff;
            border-radius: 12px;
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
            background-color: #111116;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        /* Top Bar: Copy Button Sub-Header */
        .top-utility-bar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        /* Top Copy Button */
        .top-copy-btn {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.4);
        }

        .top-copy-btn:hover {
            background-color: #0056b3;
            transform: translateY(-1px);
        }

        /* Header Layout: Logo + App Name Left Par, Search Right Par */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 2px solid #1f1f2e;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* Blue Circle Logo */
        .blue-circle {
            width: 35px;
            height: 35px;
            background-color: #007bff;
            border-radius: 50%;
            box-shadow: 0 0 15px #007bff;
        }

        .app-title {
            font-size: 28px;
            font-weight: bold;
        }

        /* Rectangular Search Box */
        .search-container input {
            width: 250px;
            padding: 10px 15px;
            border: 2px solid #ffffff;
            border-radius: 6px;
            background-color: #1a1a24;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        /* VLC Orange Trim Video Player Interface Frame (Fill space correctly) */
        .vlc-media-container {
            background: #000;
            border: 3px solid #ffaa00;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 35px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.9);
            display: none; /* Active via card click */
        }

        .player-frame-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio to remove black bars */
            height: 0;
            overflow: hidden;
            background-color: #000;
        }

        .player-frame-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* VLC Control Strip Panel */
        .vlc-control-strip {
            background: #1e1e26;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-top: 1px solid #2d2d3d;
        }

        .vlc-cone { font-size: 24px; }
        .track-details { text-align: left; flex: 1; }
        .track-details h3 { color: #ffaa00; font-size: 18px; margin-bottom: 2px; }
        .track-details p { color: #888; font-size: 12px; }

        /* Headings Font Style */
        .section-title {
            font-size: 26px;
            text-align: left;
            margin-bottom: 20px;
            margin-top: 25px;
            font-weight: normal;
        }

        /* 4-Column Linear Dashboard Grid Items Box */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 35px;
        }

        .movie-card {
            border: 2px solid #ffffff;
            border-radius: 8px;
            background-color: #1a1a24;
            height: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.25s ease;
            padding: 10px;
        }

        .movie-card:hover {
            border-color: #ffaa00;
            background-color: #222230;
            transform: scale(1.03);
        }

        .card-icon { font-size: 34px; margin-bottom: 8px; }
        .card-name { font-size: 14px; font-weight: 500; color: #e5e5e9; text-align: center; }

        @media (max-width: 768px) {
            .cards-grid { grid-template-columns: repeat(2, 1fr); }
            header { flex-direction: column; gap: 15px; align-items: flex-start; }
            .search-container input { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container-border">
        
        <!-- Top Utility Bar for Copy Button -->
        <div class="top-utility-bar">
            <button class="top-copy-btn" onclick="copyWebsiteURL()">📋 Copy Link</button>
        </div>

        <!-- Header: Logo, Name & Search -->
        <header>
            <div class="logo-section">
                <div class="blue-circle"></div>
                <div class="app-title">stream app</div>
            </div>
            <div class="search-container">
                <input type="text" placeholder="search">
            </div>
        </header>

        <!-- VLC Real Live Unblockable Cloud Video Player Box -->
        <div class="vlc-media-container" id="vlc-player-panel">
            <div class="player-frame-wrapper">
                <!-- Safe streaming engine embed that bypasses network blocks -->
                <iframe id="vlc-iframe-stream" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
            </div>
            <div class="vlc-control-strip">
                <div class="vlc-cone">🍊</div>
                <div class="track-details">
                    <h3 id="vlc-title-text">VLC Player Ready</h3>
                    <p id="vlc-status-text">Official stream track loaded successfully.</p>
                </div>
            </div>
        </div>

        <!-- Layout Section 1: Animations Movie -->
        <div class="section-title">animations movie</div>
        <div class="cards-grid">
            <div class="movie-card" onclick="playVlcStream('Big Buck Bunny Short', 'https://vimeo.com', 'Classic open source bunny comedy running over stable streaming cloud network.')">
                <div class="card-icon">🐰</div>
                <div class="card-name">Bunny Story</div>
            </div>
            <div class="movie-card" onclick="playVlcStream('Sintel Animation Movie', 'https://vimeo.com', 'Blender foundation open source fantasy trailer playing smoothly.')">
                <div class="card-icon">🐉</div>
                <div class="card-name">Sintel Trailer</div>
            </div>
            <div class="movie-card" onclick="playVlcStream('Tears of Steel Sci-Fi', 'https://vimeo.com', 'Open source VFX project short film simulation active.')">
                <div class="card-icon">🤖</div>
                <div class="card-name">Tears of Steel</div>
            </div>
            <div class="movie-card" onclick="playVlcStream('Sitcom Open Stream', 'https://vimeo.com', 'Standard graphic test asset streaming smoothly over cloud framework.')">
                <div class="card-icon">🐑</div>
                <div class="card-name">Cosmos Short</div>
            </div>
        </div>

        <!-- Layout Section 2: Anime -->
        <div class="section-title">anime</div>
        <div class="cards-grid">
            <div class="movie-card" onclick="playVlcStream('One Piece (Hindi Concept Video)', 'https://vimeo.com', 'Monkey D. Luffy Straw Hat crew animation video track active.')">
                <div class="card-icon">🏴‍☠️</div>
                <div class="card-name">One Piece (Hindi)</div>
            </div>
            <div class="movie-card" onclick="playVlcStream('One Piece (English Concept Video)', 'https://vimeo.com', 'Official English audio conceptual tracking source activated safely.')">
                <div class="card-icon">👑</div>
                <div class="card-name">One Piece (English)</div>
            </div>
            <div class="movie-card" onclick="playVlcStream('Naruto Shippuden Promo', 'https://vimeo.com', 'Hidden Leaf Village ninja combat clip simulation active on player.')">
                <div class="card-icon">🦊</div>
                <div class="card-name">Naruto (Hindi)</div>
            </div>
            <div class="movie-card" onclick="playVlcStream('Death Note Thriller Intro', 'https://vimeo.com', 'Psychological thriller detective battle clip loaded over framework player.')">
                <div class="card-icon">📓</div>
                <div class="card-name">Death Note (Hindi)</div>
            </div>
        </div>

    </div>

    <script>
        // Unblockable Vimeo Cloud Network Streaming Bridge Engine
        function playVlcStream(mediaTitle, streamUrl, statusLog) {
            var playerPanel = document.getElementById('vlc-media-container');
